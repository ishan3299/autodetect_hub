<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MITRE Heatmap - AutoDetect Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body>
    <div class="sidebar">
        <div class="brand">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="28" height="28">
                <path
                    d="M12 2L2 7l10 5 10-5-10-5zm0 9l2.5-1.25L12 8.5l-2.5 1.25L12 11zm0 2.5l-5-2.5-5 2.5L12 22l10-8.5-5-2.5-5 2.5z" />
            </svg>
            AutoDetect Hub
        </div>
        <nav>
            <a href="index.html">Dashboard</a>
            <a href="indicators.html">Indicators</a>
            <a href="rules.html">Rules</a>
            <a href="heatmap.html" class="active">MITRE Heatmap</a>
            <a href="results.html">Results</a>
        </nav>
    </div>

    <main>
        <div class="header-bar">
            <h1>MITRE ATT&CK® Enterprise Matrix Coverage</h1>
            <div style="color: var(--text-secondary); font-size: 0.9rem;">
                Techniques Covered: <span id="coverage-count"
                    style="color: var(--accent-secondary); font-weight: bold;">0</span>
            </div>
        </div>

        <div class="card">
            <div class="matrix-container">
                <div class="mitre-matrix" id="matrix-grid">
                    <!-- Populated by JS -->
                </div>
            </div>
        </div>
    </main>

    <script src="assets/js/mitre_matrix.js"></script>
    <script src="assets/js/main.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', async () => {
            const coverage = await fetchJSON('attack-coverage.json') || {};
            const grid = document.getElementById('matrix-grid');
            const countEl = document.getElementById('coverage-count');

            // Render Matrix Headers
            const tactics = Object.keys(MITRE_MATRIX);
            tactics.forEach(tactic => {
                const col = document.createElement('div');
                col.className = 'tactic-column';

                // Header
                const header = document.createElement('div');
                header.className = 'tactic-header';
                header.innerText = tactic;
                col.appendChild(header);

                // Techniques
                MITRE_MATRIX[tactic].forEach(tech => {
                    const cell = document.createElement('div');
                    cell.className = 'technique-cell';
                    cell.id = tech.id;

                    if (coverage[tech.id]) {
                        cell.classList.add('covered');
                        cell.title = `Covered by ${coverage[tech.id]} rule(s)`;
                    }

                    cell.innerHTML = `
                        <span class="technique-id">${tech.id}</span>
                        ${tech.name}
                    `;
                    col.appendChild(cell);
                });

                grid.appendChild(col);
            });

            countEl.innerText = Object.keys(coverage).length;
        });
    </script>
</body>

</html>
