<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Results - AutoDetect Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body>
    <div class="sidebar">
        <div class="brand">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="28" height="28">
                <path
                    d="M12 2L2 7l10 5 10-5-10-5zm0 9l2.5-1.25L12 8.5l-2.5 1.25L12 11zm0 2.5l-5-2.5-5 2.5L12 22l10-8.5-5-2.5-5 2.5z" />
            </svg>
            AutoDetect Hub
        </div>
        <nav>
            <a href="index.html">Home</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="indicators.html">Indicators</a>
            <a href="rules.html">Rules</a>
            <a href="heatmap.html">MITRE Heatmap</a>
            <a href="results.html" class="active">Results</a>
        </nav>
    </div>

    <main>
        <div class="header-bar">
            <h1>Pipeline Results</h1>
        </div>

        <div class="card">
            <h2>Data Statistics</h2>
            <table class="results-table">
                <thead>
                    <tr>
                        <th>Metric</th>
                        <th>Value</th>
                        <th>Source File</th>
                    </tr>
                </thead>
                <tbody id="stats-body">
                    <!-- Populated by JS -->
                </tbody>
            </table>
        </div>

        <div class="card">
            <h2>Raw Artifacts</h2>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 2rem;">
                <div>
                    <h3>Collected Data</h3>
                    <ul style="color: var(--text-secondary);">
                        <li><a href="indicators.json" target="_blank"
                                style="color: var(--accent-secondary);">indicators.json</a>
                        </li>
                        <li><a href="attack-coverage.json" target="_blank"
                                style="color: var(--accent-secondary);">attack-coverage.json</a></li>
                    </ul>
                </div>
                <div>
                    <h3>Rules Files</h3>
                    <ul style="color: var(--text-secondary);">
                        <li><a href="suricata/all_rules.rules" target="_blank"
                                style="color: var(--accent-secondary);">all_rules.rules</a></li>
                        <li><a href="kql/all_rules.kql" target="_blank"
                                style="color: var(--accent-secondary);">all_rules.kql</a>
                        </li>
                        <li><a href="sigma/all_rules.yml" target="_blank"
                                style="color: var(--accent-secondary);">all_rules.yml</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </main>

    <script src="assets/js/main.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', async () => {
            const analytics = await fetchJSON('analytics.json');
            const coverage = await fetchJSON('attack-coverage.json') || {};

            // Populating Stats
            const statsBody = document.getElementById('stats-body');
            if (analytics) {
                statsBody.innerHTML = `
                    <tr>
                        <td>Total Indicators</td>
                        <td>${analytics.total_iocs.toLocaleString()}</td>
                        <td><a href="indicators.json" style="color: var(--accent-secondary);">indicators.json</a></td>
                    </tr>
                    <tr>
                        <td>ATT&CK Techniques Covered</td>
                        <td>${Object.keys(coverage).length}</td>
                        <td><a href="attack-coverage.json" style="color: var(--accent-secondary);">attack-coverage.json</a></td>
                    </tr>
                `;
            } else {
                statsBody.innerHTML = `
                    <tr>
                        <td>Total Indicators</td>
                        <td>Error loading data</td>
                        <td><a href="indicators.json" style="color: var(--accent-secondary);">indicators.json</a></td>
                    </tr>
                `;
            }
        });
    </script>
</body>

</html>
