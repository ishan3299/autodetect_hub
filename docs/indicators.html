<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indicators - AutoDetect Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body>
    <div class="sidebar">
        <div class="brand">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="28" height="28">
                <path
                    d="M12 2L2 7l10 5 10-5-10-5zm0 9l2.5-1.25L12 8.5l-2.5 1.25L12 11zm0 2.5l-5-2.5-5 2.5L12 22l10-8.5-5-2.5-5 2.5z" />
            </svg>
            AutoDetect Hub
        </div>
        <nav>
            <a href="index.html">Home</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="indicators.html" class="active">Indicators</a>
            <a href="rules.html">Rules</a>
            <a href="heatmap.html">MITRE Heatmap</a>
            <a href="results.html">Results</a>
        </nav>
    </div>

    <main>
        <div class="header-bar">
            <h1>Threat Indicators</h1>
            <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
                <select id="filter-type"
                    style="padding: 0.5rem; border-radius: 6px; background: var(--glass-bg); color: var(--text-primary); border: 1px solid var(--glass-border);">
                    <option value="">All Types</option>
                </select>
                <select id="filter-source"
                    style="padding: 0.5rem; border-radius: 6px; background: var(--glass-bg); color: var(--text-primary); border: 1px solid var(--glass-border);">
                    <option value="">All Sources</option>
                </select>
                <button id="btn-reset"
                    style="padding: 0.5rem 1rem; border-radius: 6px; background: var(--glass-border); color: var(--text-primary); border: none; cursor: pointer;">Reset</button>
                <div style="width: 1px; background: var(--glass-border); margin: 0 0.5rem;"></div>
                <input type="text" id="search" placeholder="Search..."
                    style="margin-bottom: 0; padding: 0.5rem; border-radius: 6px; background: var(--glass-bg); border: 1px solid var(--glass-border); color: var(--text-primary);">
                <button id="btn-export"
                    style="padding: 0.5rem 1rem; border-radius: 6px; background: var(--accent-glow); color: var(--accent-secondary); border: 1px solid var(--accent-secondary); cursor: pointer;">Export
                    CSV</button>
            </div>
        </div>

        <div class="card">
            <div id="loading-spinner" style="text-align: center; padding: 3rem; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem; color: var(--text-secondary);">
                <div style="width: 40px; height: 40px; border: 4px solid var(--glass-border); border-top-color: var(--accent-secondary); border-radius: 50%; animation: spin 1s linear infinite;"></div>
                <div style="font-weight: 500; font-size: 1rem;">Loading indicators (7.1 MB)...</div>
            </div>
            <table id="ind-table" style="display: none;">
                <thead>
                    <tr>
                        <th>Value</th>
                        <th>Type</th>
                        <th>Source</th>
                        <th>Tags</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Populated by JS -->
                </tbody>
            </table>
        </div>
    </main>

    <script src="assets/js/main.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', async () => {
            const indicators = await fetchJSON('indicators.json') || [];
            
            // Hide spinner and show table
            document.getElementById('loading-spinner').style.display = 'none';
            document.getElementById('ind-table').style.display = 'table';

            const tbody = document.querySelector('#ind-table tbody');
            const searchInput = document.getElementById('search');
            const typeSelect = document.getElementById('filter-type');
            const sourceSelect = document.getElementById('filter-source');
            const resetBtn = document.getElementById('btn-reset');
            const exportBtn = document.getElementById('btn-export');

            // Populate Filters
            const distinctTypes = [...new Set(indicators.map(i => i.indicator_type))].sort();
            const distinctSources = [...new Set(indicators.map(i => i.source))].sort();

            distinctTypes.forEach(t => typeSelect.add(new Option(t, t)));
            distinctSources.forEach(s => sourceSelect.add(new Option(s, s)));

            function applyFilters() {
                const term = searchInput.value.toLowerCase();
                const type = typeSelect.value;
                const source = sourceSelect.value;

                const filtered = indicators.filter(i => {
                    const matchTerm = !term || i.indicator.toLowerCase().includes(term) || (i.tags || []).join(' ').toLowerCase().includes(term);
                    const matchType = !type || i.indicator_type === type;
                    const matchSource = !source || i.source === source;
                    return matchTerm && matchType && matchSource;
                });

                render(filtered);
                return filtered;
            }

            function render(list) {
                tbody.innerHTML = '';
                list.slice(0, 100).forEach(item => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td><code>${item.indicator}</code></td>
                        <td>${item.indicator_type}</td>
                        <td>${item.source}</td>
                        <td>${(item.tags || []).map(t => `<span style="background: rgba(255,255,255,0.1); padding: 2px 6px; border-radius: 4px; font-size: 0.85em;">${t}</span>`).join(' ')}</td>
                    `;
                    tbody.appendChild(tr);
                });
            }

            // Event Listeners
            searchInput.addEventListener('input', applyFilters);
            typeSelect.addEventListener('change', applyFilters);
            sourceSelect.addEventListener('change', applyFilters);

            resetBtn.addEventListener('click', () => {
                searchInput.value = '';
                typeSelect.value = '';
                sourceSelect.value = '';
                applyFilters();
            });

            exportBtn.addEventListener('click', () => {
                const currentData = applyFilters();
                downloadCSV(currentData, 'indicators_export.csv');
            });

            render(indicators);
        });
    </script>
</body>

</html>
