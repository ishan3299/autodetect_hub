<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indicators - AutoDetect Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body>
    <div class="sidebar">
        <div class="brand">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="28" height="28">
                <path
                    d="M12 2L2 7l10 5 10-5-10-5zm0 9l2.5-1.25L12 8.5l-2.5 1.25L12 11zm0 2.5l-5-2.5-5 2.5L12 22l10-8.5-5-2.5-5 2.5z" />
            </svg>
            AutoDetect Hub
        </div>
        <nav>
            <a href="index.html">Dashboard</a>
            <a href="indicators.html" class="active">Indicators</a>
            <a href="rules.html">Rules</a>
            <a href="heatmap.html">MITRE Heatmap</a>
            <a href="results.html">Results</a>
        </nav>
    </div>

    <main>
        <div class="header-bar">
            <h1>Threat Indicators</h1>
            <input type="text" id="search" placeholder="Search indicators..." style="margin-bottom: 0; width: 300px;">
        </div>

        <div class="card">
            <table id="ind-table">
                <thead>
                    <tr>
                        <th>Value</th>
                        <th>Type</th>
                        <th>Source</th>
                        <th>Tags</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Populated by JS -->
                </tbody>
            </table>
        </div>
    </main>

    <script src="assets/js/main.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', async () => {
            const indicators = await fetchJSON('indicators.json') || [];
            const tbody = document.querySelector('#ind-table tbody');
            const search = document.getElementById('search');

            function render(list) {
                tbody.innerHTML = '';
                list.slice(0, 100).forEach(item => { // Limit to 100 for perf in demo
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td><code>${item.indicator}</code></td>
                        <td>${item.indicator_type}</td>
                        <td>${item.source}</td>
                        <td>${(item.tags || []).map(t => `<span style="background: rgba(255,255,255,0.1); padding: 2px 6px; border-radius: 4px; font-size: 0.85em;">${t}</span>`).join(' ')}</td>
                    `;
                    tbody.appendChild(tr);
                });
            }

            render(indicators);

            search.addEventListener('input', (e) => {
                const term = e.target.value.toLowerCase();
                const filtered = indicators.filter(i =>
                    i.indicator.toLowerCase().includes(term) ||
                    (i.tags || []).join(' ').toLowerCase().includes(term)
                );
                render(filtered);
            });
        });
    </script>
</body>

</html>
