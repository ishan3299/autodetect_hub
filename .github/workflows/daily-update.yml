name: Daily Threat Intel Update

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Fetch CTI Data
        run: |
          python scripts/fetch_urlhaus.py
          python scripts/fetch_malwarebazaar.py
          python scripts/fetch_feodotracker.py

      - name: Normalize Data
        run: python scripts/normalize.py

      - name: Generate Rules
        run: |
          python scripts/generate_sigma.py
          python scripts/generate_suricata.py
          python scripts/generate_kql.py

      - name: Generate Analytics
        run: python scripts/generate_analytics.py

      - name: Generate Heatmap
        run: python scripts/build_attack_heatmap.py

      - name: Publish to Docs
        run: |
          # Copy data for frontend
          cp data/normalized/indicators.json docs/indicators.json
          
          # Create directories
          mkdir -p docs/suricata docs/kql docs/sigma
          
          # Clear old rules to prevent stale rules
          rm -f docs/suricata/* docs/kql/* docs/sigma/*
          
          # Copy fresh rules
          cp detections/suricata/all_rules.rules docs/suricata/
          cp detections/kql/all_rules.kql docs/kql/
          cp detections/sigma/*.yml docs/sigma/

      - name: Commit and Push
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add data detections docs
          git commit -m "Auto-update: $(date -u)" || echo "No changes to commit"
          git push
